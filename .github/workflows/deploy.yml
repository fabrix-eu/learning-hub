name: Deploy

on:
  push:
    branches: [main]
  # Directus fires this after an editor publishes, so content updates redeploy
  # without a code change. See CLAUDE.md → "Publishing a topic".
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_DIRECTUS_URL: https://back.fabrixproject.eu
          VITE_PLATFORM_URL: https://platform.fabrixproject.eu
          SITE_URL: https://learn.fabrixproject.eu
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
